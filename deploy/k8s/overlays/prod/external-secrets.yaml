apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager-store
  namespace: kg-prod
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: knowledge-graph-platform-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: knowledge-graph-platform-secrets
  namespace: kg-prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager-store
    kind: SecretStore
  target:
    name: knowledge-graph-platform-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: kg-platform/prod/credentials
        property: postgres_password
    - secretKey: NEO4J_PASSWORD
      remoteRef:
        key: kg-platform/prod/credentials
        property: neo4j_password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: kg-platform/prod/credentials
        property: redis_password
    - secretKey: MINIO_PASSWORD
      remoteRef:
        key: kg-platform/prod/credentials
        property: minio_password
    - secretKey: OPENSEARCH_PASSWORD
      remoteRef:
        key: kg-platform/prod/credentials
        property: opensearch_password
