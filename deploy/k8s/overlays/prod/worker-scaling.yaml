apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: docling-ingestion-worker-hpa
  namespace: kg-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: docling-ingestion-worker
  minReplicas: 4
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
