apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  namespace: kg-prod
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/part-of: knowledge-graph-system
spec:
  serviceName: qdrant-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
        app.kubernetes.io/part-of: knowledge-graph-system
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.12.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-rest
              containerPort: 6333
              protocol: TCP
            - name: grpc
              containerPort: 6334
              protocol: TCP
            - name: p2p
              containerPort: 6335
              protocol: TCP
          env:
            - name: QDRANT__CLUSTER__ENABLED
              value: "true"
            - name: QDRANT__STORAGE__STORAGE_PATH
              value: "/qdrant/storage"
          volumeMounts:
            - name: qdrant-storage
              mountPath: /qdrant/storage
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 6333
            initialDelaySeconds: 15
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: qdrant-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: "ebs-gp3-sc"
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: kg-prod
  labels:
    app.kubernetes.io/name: qdrant
spec:
  type: ClusterIP
  ports:
    - name: http-rest
      port: 6333
      targetPort: 6333
    - name: grpc
      port: 6334
      targetPort: 6334
  selector:
    app.kubernetes.io/name: qdrant
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant-headless
  namespace: kg-prod
  labels:
    app.kubernetes.io/name: qdrant
spec:
  clusterIP: None
  ports:
    - name: p2p
      port: 6335
      targetPort: 6335
  selector:
    app.kubernetes.io/name: qdrant
