apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-graph-platform
  labels:
    app.kubernetes.io/name: knowledge-graph-platform
    app.kubernetes.io/component: api-service
    app.kubernetes.io/part-of: knowledge-graph-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: knowledge-graph-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knowledge-graph-platform
        app.kubernetes.io/component: api-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: knowledge-graph-platform-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-api
          image: ghcr.io/knowledge-graph-platform/knowledge-graph-platform:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["/app/platform-svc", "server"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http-api
              containerPort: 8000
              protocol: TCP
            - name: grpc-api
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1024Mi
          envFrom:
            - configMapRef:
                name: knowledge-graph-platform-config
          env:
            - name: GOMEMLIMIT
              value: "768MiB"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          startupProbe:
            httpGet:
              path: /healthz
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-api
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http-api
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: secrets
          secret:
            secretName: knowledge-graph-platform-secrets
      terminationGracePeriodSeconds: 30
