apiVersion: v1
kind: Service
metadata:
  name: knowledge-graph-platform
  labels:
    app.kubernetes.io/name: knowledge-graph-platform
    app.kubernetes.io/component: api-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: knowledge-graph-platform
  ports:
    - name: http-api
      port: 8000
      targetPort: http-api
      protocol: TCP
    - name: grpc-api
      port: 9090
      targetPort: grpc-api
      protocol: TCP
