apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-connect
  labels:
    app.kubernetes.io/name: debezium-connect
    app.kubernetes.io/component: cdc-engine
    app.kubernetes.io/part-of: knowledge-graph-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: debezium-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: debezium-connect
    spec:
      serviceAccountName: knowledge-graph-platform-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: debezium
          image: debezium/connect:2.7.3.Final
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http-rest
              containerPort: 8083
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          env:
            - name: BOOTSTRAP_SERVERS
              value: "kafka.storage.svc.cluster.local:9092"
            - name: GROUP_ID
              value: "debezium-cdc"
            - name: CONFIG_STORAGE_TOPIC
              value: "debezium_configs"
            - name: OFFSET_STORAGE_TOPIC
              value: "debezium_offsets"
            - name: STATUS_STORAGE_TOPIC
              value: "debezium_statuses"
          livenessProbe:
            httpGet:
              path: /connectors
              port: http-rest
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /connectors
              port: http-rest
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-connect
  labels:
    app.kubernetes.io/name: debezium-connect
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: debezium-connect
  ports:
    - name: http-rest
      port: 8083
      targetPort: http-rest
      protocol: TCP
