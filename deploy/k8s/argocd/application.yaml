apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: knowledge-graph-platform-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: knowledge-graph-platform
    app.kubernetes.io/part-of: knowledge-graph-system
    app.kubernetes.io/environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Chief-Strategist-J/knowledge-graph-platform.git
    targetRevision: main
    path: deploy/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: kg-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: knowledge-graph-system
  namespace: argocd
spec:
  description: "Enterprise Knowledge Graph Platform GitOps Project"
  sourceRepos:
    - "https://github.com/Chief-Strategist-J/knowledge-graph-platform.git"
  destinations:
    - namespace: "kg-prod"
      server: "https://kubernetes.default.svc"
    - namespace: "kg-staging"
      server: "https://kubernetes.default.svc"
  clusterResourceWhitelist:
    - group: "networking.k8s.io"
      kind: "IngressClass"
    - group: "storage.k8s.io"
      kind: "StorageClass"
