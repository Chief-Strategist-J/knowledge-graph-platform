apiVersion: 1

datasources:
  # 1. Prometheus Metrics (System, Kafka, Neo4j, Go, Docling metrics)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  # 2. Loki Logs (Structured container and service logs)
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000

  # 3. Tempo Distributed Tracing (OTLP trace ingestion)
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMode: GET
      search:
        hide: false
      tracesToLogsV2:
        datasourceUid: 'Loki'
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
        tags: ['service.name', 'container_name']
        filterByTraceId: true
        filterBySpanId: true

  # 4. PostgreSQL (Metadata & Ingestion States)
  - name: PostgreSQL-Metadata
    type: postgres
    access: proxy
    url: postgres:5432
    database: knowledge_graph
    user: kg_admin
    secureJsonData:
      password: kg_dev_password_123!
    jsonData:
      sslmode: 'disable'
      postgresVersion: 1600
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
