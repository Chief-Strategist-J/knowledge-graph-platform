# Canonical Infrastructure Compose Manifest for Knowledge Graph Platform
name: knowledge-graph-platform-infra

x-hardening: &hardening
  read_only: false
  init: false
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "5"

x-stateful: &stateful
  <<: *hardening
  stop_grace_period: 60s
  networks: [backend]

services:
  # Edge Reverse Proxy: Caddy
  proxy:
    <<: *hardening
    image: caddy:2.8.4-alpine
    ports:
      - "127.0.0.1:8000:80"
      - "127.0.0.1:3000:3000"
    networks: [frontend, backend]
    tmpfs: [/tmp, /var/run]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # Relational Database: PostgreSQL 16
  postgres:
    <<: *stateful
    image: postgres:16.4-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    environment:
      POSTGRES_DB: knowledge_graph
      POSTGRES_USER: kg_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets: [pg_password]
    tmpfs: [/tmp, /var/run/postgresql]
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kg_admin -d knowledge_graph"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1024M }

  # Graph Database: Neo4j 5.23 with GDS
  neo4j:
    <<: *stateful
    image: neo4j:5.23.0-community
    environment:
      NEO4J_AUTH: neo4j/neo4j_password_place
      NEO4J_PLUGINS: '["graph-data-science"]'
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1024m
      NEO4J_server_memory_pagecache_size: 512m
    tmpfs: [/tmp]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "neo4j-admin", "server", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2048M }

  # Event Streaming: Apache Kafka KRaft
  kafka:
    <<: *stateful
    image: apache/kafka:3.8.0
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
    tmpfs: [/tmp]
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-cluster.sh cluster-id --bootstrap-server 127.0.0.1:9092 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1024M }

  # Change Data Capture: Debezium
  debezium:
    <<: *stateful
    image: debezium/connect:2.7.3.Final
    depends_on:
      kafka:    { condition: service_healthy, restart: true }
      postgres: { condition: service_healthy, restart: true }
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
    tmpfs: [/tmp]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8083/connectors"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1024M }

  # Vector Database: Qdrant
  qdrant:
    <<: *stateful
    image: qdrant/qdrant:v1.11.3
    environment:
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
    tmpfs: [/tmp]
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "cat /dev/null > /dev/tcp/127.0.0.1/6333"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1024M }

  # Search Engine: OpenSearch 2.16
  opensearch:
    <<: *stateful
    image: opensearchproject/opensearch:2.16.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "false"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:?AdminPassword123!}
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    tmpfs: [/tmp]
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -k -u admin:$$OPENSEARCH_INITIAL_ADMIN_PASSWORD https://127.0.0.1:9200/_cluster/health | grep -q 'cluster_name'"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1536M }

  # Cache: Redis
  redis:
    <<: *stateful
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set_redis_password}"]
    tmpfs: [/tmp]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # Object Storage: MinIO
  minio:
    <<: *stateful
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set_minio_password}
    tmpfs: [/tmp]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # Tracing Store: Tempo
  tempo:
    <<: *stateful
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    networks: [frontend, backend]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4318:4318"
    volumes:
      - ../observability/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # OpenTelemetry Collector
  otel-collector:
    <<: *hardening
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ../observability/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    networks: [backend]
    tmpfs: [/tmp]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

  # Metrics: Prometheus
  prometheus:
    <<: *stateful
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    tmpfs: [/tmp]
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # Logs: Loki
  loki:
    <<: *stateful
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/local-config.yaml"]
    networks: [frontend, backend]
    ports:
      - "127.0.0.1:3100:3100"
    tmpfs: [/tmp]
    volumes:
      - ../observability/loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

  # Dashboards: Grafana
  grafana:
    <<: *hardening
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_password_123!
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    networks: [frontend, backend]
    tmpfs: [/tmp]
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512M }

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  qdrant_data:
  opensearch_data:
  kafka_data:
  redis_data:
  minio_data:
  tempo_data:
  prometheus_data:
  loki_data:
  grafana_data:

secrets:
  pg_password:
    file: ../../release/secrets/pg_password.txt

configs:
  caddy_config:
    file: ../../topology/Caddyfile
